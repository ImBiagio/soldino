# Proxy "edge" del homeserver: l'unico container con le porte 80/443. Smista
# per hostname verso i Caddy interni delle app (cinemino, soldino) sulla rete
# Docker "edge" e gestisce i certificati Let's Encrypt di tutti i domini.
# Sul server sta in ~/edge con il Caddyfile accanto.
name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data
      - config:/config
    networks:
      - edge

networks:
  # Creata a mano una volta: docker network create edge
  edge:
    external: true

volumes:
  data:
  config:
