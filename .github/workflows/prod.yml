# Push sul branch prod → test, poi build&push delle immagini su ghcr.io.
# Sul server Watchtower vede il nuovo tag :prod e aggiorna i container da solo.
# Stesso schema di cinemino.
name: prod

on:
  push:
    branches: [prod]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soldino
          POSTGRES_USER: soldino
          POSTGRES_PASSWORD: soldino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soldino"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check apps config
      - run: pytest
        env:
          POSTGRES_HOST: localhost

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx eslint src --ext .ts,.tsx

  build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: soldino-backend
            context: backend
            dockerfile: backend/Dockerfile
            target: prod
          - image: soldino-web
            context: .
            dockerfile: deploy/web.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/imbiagio/${{ matrix.image }}:prod
            ghcr.io/imbiagio/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
