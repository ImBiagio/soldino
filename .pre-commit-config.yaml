repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: docker compose run --rm --no-deps -T backend mypy apps config
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: prettier
        name: prettier (frontend)
        entry: docker compose run --rm --no-deps -T frontend npx prettier --write src
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: tsc
        name: tsc (frontend)
        entry: docker compose run --rm --no-deps -T frontend npx tsc -b
        language: system
        files: ^frontend/src/
        pass_filenames: false
