[project]
name = "soldino-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.2",
    "drf-spectacular>=0.27",
    "django-simple-history>=3.7",
    "django-celery-beat>=2.6",
    "celery[redis]>=5.4",
    "google-genai>=1.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise[brotli]>=6.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "Pillow>=10.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "watchfiles>=0.22",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Il progetto non e' una libreria: pyproject serve solo a dichiarare le
# dipendenze. Nessun package da installare, il codice sta su WORKDIR.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --disable-warnings"
testpaths = ["apps"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
